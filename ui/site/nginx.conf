# The public landing. /ingest forwards analytics to PostHog EU from getkoi.co itself, so blockers of
# third-party hosts keep the visit, and no cookie leaves this origin.
server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # /privacy serves privacy/index.html directly instead of redirecting to /privacy/.
        try_files $uri $uri/index.html =404;
    }

    # Vite puts a hash of the content in these names, so a file never changes under its address.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # OpenAI reads this token to confirm the domain. It has no extension, so name its type.
    location = /.well-known/openai-apps-challenge {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location /ingest/static/ {
        proxy_pass https://eu-assets.i.posthog.com/static/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu-assets.i.posthog.com;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    location /ingest/array/ {
        proxy_pass https://eu-assets.i.posthog.com/array/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu-assets.i.posthog.com;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    location /ingest/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Set-Cookie;
        client_max_body_size 2m;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
