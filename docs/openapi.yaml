    OrgRes:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
    HealthResponse:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
        db:
          type: string
    CapabilitiesResponse:
      type: object
      required: [competitorSearch, aiDrafting, liveCollection, cloudBilling]
      properties:
        cloudBilling:
          type: boolean
        liveCollection:
          type: boolean
        competitorSearch:
          type: boolean
        aiDrafting:
          type: boolean
    BillingAllowanceRequest:
      type: object
      required: [prompts]
      properties:
        prompts:
          type: integer
          minimum: 5
          maximum: 500
          description: "Selectable allowances: 5, 10, 15, 25, 50, 75, 100, 150, 200, 250, 350, 500."
    BillingQuote:
      type: object
      required: [prompts, amount_cents, currency, interval]
      properties:
        prompts:
          type: integer
        amount_cents:
          type: integer
          format: int64
        currency:
          type: string
        interval:
          type: string
    BillingSubscription:
      type: object
      required: [organization_id, quantity, status, cancel_at_period_end]
      properties:
        organization_id:
          type: string
          format: uuid
        quantity:
          type: integer
        status:
          type: string
        current_period_end:
          type: string
          format: date-time
          nullable: true
        trial_end:
          type: string
          format: date-time
          nullable: true
        pending_quantity:
          type: integer
          nullable: true
        cancel_at_period_end:
          type: boolean
    BillingStatus:
      type: object
      required: [subscription, prompt_limit, trial_available]
      properties:
        subscription:
          allOf:
            - $ref: "#/components/schemas/BillingSubscription"
          nullable: true
        prompt_limit:
          type: integer
        trial_available:
          type: boolean
    BillingRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    BillingChange:
      type: object
      required: [quantity, effective]
      properties:
        quantity:
          type: integer
        effective:
          type: string
    GenerationRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [initial, prompts, competitors]
    GenerationAccepted:
      type: object
      required: [id, mode, state, status_url]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [initial, prompts, competitors]
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        status_url:
          type: string
    GenerationStatus:
      type: object
      required: [id, mode, state, attempt, prompt_count, competitor_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [initial, prompts, competitors]
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        attempt:
          type: integer
          minimum: 0
        prompt_count:
          type: integer
          minimum: 0
        competitor_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        next_retry_at:
          type: string
          format: date-time
        error_code:
          type: string
    GenerationPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GenerationStatus"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    Envelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        status_url:
          type: string
          description: Present for generation_conflict to locate the active run.
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          $ref: "#/components/schemas/FieldCode"
    ErrorCode:
      type: string
      enum:
        - validation
        - email_taken
        - brand_limit_reached
        - invalid_credentials
        - not_found
        - unauthorized
        - invalid_json
        - internal
        - feature_unavailable
        - generation_conflict
        - idempotency_conflict
        - initial_already_completed
        - billing_required
        - prompt_limit_reached
    FieldCode:
      type: string
      enum:
        - invalid
        - min_length
        - taken
