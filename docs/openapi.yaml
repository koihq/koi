      properties:
        id:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        githubRepo:
          type: string
          format: uri
        source:
          type: string
          enum: [manual, drafted, observed]
        confirmed:
          type: boolean
        aliases:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
        additionalUrls:
          type: array
          maxItems: 20
          description: Additional official website origins or GitHub repository roots
          items:
            type: string
            format: uri
    CredentialsReq:
