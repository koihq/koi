openapi: 3.0.3
info:
  title: Koi API
  version: 0.0.0
servers:
  - url: /
tags:
  - name: auth
  - name: brands
  - name: prompts
  - name: competitors
  - name: health
  - name: capabilities
  - name: generations
  - name: visibility
paths:
  /api/v1/brands/{brandID}/visibility/summary:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    get:
      tags: [visibility]
      operationId: getVisibilitySummary
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/VisibilityDays"
        - $ref: "#/components/parameters/VisibilityEngines"
      responses:
        "402":
          $ref: "#/components/responses/Error"
        "200":
          description: Visibility across saved answers for the selected period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityReport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/tracking:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    get:
      operationId: getVisibilityTracking
      tags: [visibility]
      security:
        - cookieAuth: []
      responses:
        "402":
          $ref: "#/components/responses/Error"
        "200":
          description: Review and daily collection schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/runs:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    get:
      tags: [visibility]
      operationId: listVisibilityRuns
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Saved visibility runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityRunPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompt-history:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    get:
      tags: [visibility]
      operationId: listHistoricalPrompts
      description: Deleted prompts with saved run results, newest snapshot first.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/PromptSort"
        - $ref: "#/components/parameters/Descending"
        - $ref: "#/components/parameters/VisibilityDays"
        - $ref: "#/components/parameters/VisibilityEngines"
      responses:
        "402":
          $ref: "#/components/responses/Error"
        "200":
          description: Page of historical prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalPromptPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompt-history/{promptID}/runs:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/PromptID"
    get:
      tags: [visibility]
      operationId: listPromptHistoryRuns
      description: Saved runs and answers for a live or deleted prompt, newest first.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "402":
          $ref: "#/components/responses/Error"
        "200":
          description: Page of runs with this prompt's results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptHistoryRunPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompt-history/{promptID}/visibility:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/PromptID"
    get:
      tags: [visibility]
      operationId: getPromptVisibility
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/VisibilityDays"
        - $ref: "#/components/parameters/VisibilityEngines"
      responses:
        "402":
          $ref: "#/components/responses/Error"
        "200":
          description: Visibility for a live or deleted prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityReport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/runs/{runID}:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [visibility]
      operationId: getVisibilityRun
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Saved run status and progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityRunStatus"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/runs/{runID}/results:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [visibility]
      operationId: listVisibilityResults
      description: Results in prompt position then engine order. Pending results have null outcome and fetched_at. All completed results have one of the four outcomes, including collection errors. Prompt snapshots survive edits and deletion.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of persisted results, including pending cells
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityResultPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/capabilities:
    get:
      tags: [capabilities]
      operationId: getCapabilities
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Optional server features available to this installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsReq"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRes"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsReq"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204":
          description: No Content
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: me
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRes"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/billing/quote:
    get:
      tags: [billing]
      operationId: billingQuote
      parameters:
        - name: prompts
          in: query
          required: true
          schema:
            type: integer
            minimum: 5
            maximum: 500
            description: "Selectable allowances: 5, 10, 15, 25, 50, 75, 100, 150, 200, 250, 350, 500."
      responses:
        "200":
          description: Tax-inclusive monthly price for the exact prompt allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingQuote"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/billing/subscription:
    get:
      tags: [billing]
      operationId: billingSubscription
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Organization billing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
  /api/v1/billing/checkout:
    post:
      tags: [billing]
      operationId: billingCheckout
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingAllowanceRequest"
      responses:
        "200":
          description: Hosted Stripe Checkout redirect URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRedirect"
  /api/v1/billing/change-allowance:
    post:
      tags: [billing]
      operationId: billingChangeAllowance
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingAllowanceRequest"
      responses:
        "202":
          description: Change submitted to Stripe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingChange"
  /api/v1/billing/portal:
    post:
      tags: [billing]
      operationId: billingPortal
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Stripe Customer Portal redirect URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRedirect"
  /api/v1/webhooks/stripe:
    post:
      tags: [billing]
      operationId: stripeWebhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Verified Stripe event processed or already processed
  /api/v1/brands:
    get:
      tags: [brands]
      operationId: listBrands
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of brands owned by the session user, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [brands]
      operationId: createBrand
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/brands/countries:
    get:
      tags: [brands]
      operationId: listBrandCountries
      description: Returns all supported countries when q is omitted or blank; otherwise filters the committed country list by a case-insensitive code or English-name prefix.
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Supported countries ordered by English name, or up to 20 prefix matches ordered by match quality
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryOption"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [brands]
      operationId: getBrand
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Brand owned by the session user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRes"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [brands]
      operationId: updateBrand
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandPatchRequest"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [brands]
      operationId: activateBrand
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active brand saved in the cookie session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRes"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompts:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    get:
      tags: [prompts]
      operationId: listPrompts
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Confirmed"
        - $ref: "#/components/parameters/PromptSort"
        - $ref: "#/components/parameters/Descending"
        - $ref: "#/components/parameters/VisibilityDays"
        - $ref: "#/components/parameters/VisibilityEngines"
      responses:
        "200":
          description: Prompts for the owned brand in creation order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [prompts]
      operationId: createPrompt
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptRequest"
      responses:
        "201":
          description: Manually created and confirmed prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompts/{promptID}:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/PromptID"
    get:
      tags: [prompts]
      operationId: getPrompt
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Prompt belonging to the owned brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRes"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [prompts]
      operationId: updatePrompt
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPatchRequest"
      responses:
        "200":
          description: Updated prompt with confirmation and source preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [prompts]
      operationId: deletePrompt
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompts/{promptID}/confirm:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/PromptID"
    post:
      tags: [prompts]
      operationId: confirmPrompt
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Confirmed prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRes"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompts/confirm:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    post:
      tags: [prompts]
      operationId: confirmAllPrompts
      security:
        - cookieAuth: []
      responses:
        "204":
          description: All prompts confirmed
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/competitors:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    get:
      tags: [competitors]
      operationId: listCompetitors
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Confirmed"
      responses:
        "200":
          description: Tracked competitors for the owned brand in creation order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [competitors]
      operationId: createCompetitor
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorRequest"
      responses:
        "201":
          description: Manually created and confirmed competitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/competitors/search:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    get:
      tags: [competitors]
      operationId: searchCompetitors
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        "200":
          description: Matching companies from the configured search provider
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, domain]
                  properties:
                    name:
                      type: string
                    domain:
                      type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          description: Competitor search is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/v1/brands/{brandID}/competitors/{competitorID}:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/CompetitorID"
    get:
      tags: [competitors]
      operationId: getCompetitor
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Competitor belonging to the owned brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorRes"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [competitors]
      operationId: patchCompetitor
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorPatchRequest"
      responses:
        "200":
          description: Updated identity, preserving source and confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [competitors]
      operationId: deleteCompetitor
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/competitors/{competitorID}/confirm:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/CompetitorID"
    post:
      tags: [competitors]
      operationId: confirmCompetitor
      description: Requires a primary domain or GitHub repository; name-only observed suggestions return validation errors.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Confirmed competitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/competitors/confirm:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    post:
      tags: [competitors]
      operationId: confirmAllCompetitors
      description: Finishes competitor review and confirms manual or drafted rows. Observed suggestions require individual confirmation.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Review finished; observed suggestions remain unchanged
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/generations:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    post:
      tags: [generations]
      operationId: createGeneration
      description: Creates a run and River job atomically. A compatible active run is returned instead. A terminal replay of the same idempotency key returns 200.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationRequest"
            example:
              mode: initial
      responses:
        "200":
          description: Terminal run replayed with the same idempotency key and mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAccepted"
        "202":
          description: New or compatible active run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAccepted"
              example:
                id: 22222222-2222-4222-8222-222222222222
                mode: initial
                state: queued
                status_url: /api/v1/brands/11111111-1111-4111-8111-111111111111/generations/22222222-2222-4222-8222-222222222222
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Active mode conflict, idempotency key reused for another mode, or initial already completed. Active mode conflicts include error.status_url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/Error"
    get:
      tags: [generations]
      operationId: listGenerations
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/generations/{generationID}:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/GenerationID"
    get:
      tags: [generations]
      operationId: getGeneration
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Public status of an owned run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationStatus"
              example:
                id: 22222222-2222-4222-8222-222222222222
                mode: initial
                state: queued
                attempt: 0
                prompt_count: 0
                competitor_count: 0
                created_at: "2026-09-28T10:00:00Z"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /health:
    get:
      tags: [health]
      operationId: get
      responses:
        "402":
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  parameters:
    VisibilityDays:
      name: days
      in: query
      schema:
        type: integer
        enum: [7, 30, 90]
        default: 30
    VisibilityEngines:
      name: engines
      in: query
      description: Comma-separated visibility engine IDs; omitted means all engines.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Confirmed:
      name: confirmed
      in: query
      schema:
        type: boolean
    Query:
      name: q
      in: query
      schema:
        type: string
    PromptSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [original, prompt, rate, change]
        default: original
    Descending:
      name: descending
      in: query
      schema:
        type: boolean
        default: false
    BrandID:
      name: brandID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PromptID:
      name: promptID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompetitorID:
      name: competitorID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenerationID:
      name: generationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunID:
      name: runID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: koi_session
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
  schemas:
    HistoricalPrompt:
      type: object
      required: [prompt_id, prompt_text, last_seen_at]
      properties:
        prompt_id:
          type: string
          format: uuid
        prompt_text:
          type: string
        last_seen_at:
          type: string
          format: date-time
        visibility:
          $ref: "#/components/schemas/VisibilityReport"
    VisibilityMetric:
      type: object
      required: [completed, cited, mentioned, rate]
      properties:
        completed: { type: integer }
        cited: { type: integer }
        mentioned: { type: integer }
        rate: { type: number, format: double, nullable: true, description: Percentage of valid answers that cited or mentioned the brand }
    VisibilityDay:
      type: object
      required: [date, metric]
      properties:
        date: { type: string, format: date }
        metric:
          $ref: "#/components/schemas/VisibilityMetric"
    CompetitorVisibility:
      type: object
      required: [id, metric, series]
      properties:
        id: { type: string, format: uuid }
        metric:
          $ref: "#/components/schemas/VisibilityMetric"
        series:
          type: array
          items:
            $ref: "#/components/schemas/VisibilityDay"
    VisibilityReport:
      type: object
      required: [metric, previous, series, engines, competitors]
      properties:
        metric:
          $ref: "#/components/schemas/VisibilityMetric"
        previous:
          $ref: "#/components/schemas/VisibilityMetric"
        series:
          type: array
          items:
            $ref: "#/components/schemas/VisibilityDay"
        engines:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/VisibilityMetric"
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorVisibility"
    HistoricalPromptPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalPrompt"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    PromptHistoryRun:
      type: object
      required: [run, results]
      properties:
        run:
          $ref: "#/components/schemas/VisibilityRunStatus"
        results:
          type: array
          items:
            $ref: "#/components/schemas/VisibilityResult"
    PromptHistoryRunPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PromptHistoryRun"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    VisibilityRunStatus:
      type: object
      required: [id, brand_id, engines, state, total_results, completed_results, created_at, started_at, finished_at, error_code, status_url]
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        engines:
          type: array
          items:
            $ref: "#/components/schemas/VisibilityEngine"
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        total_results:
          type: integer
          format: int64
        completed_results:
          type: integer
          format: int64
          description: Number of results with a terminal outcome, including errors
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error_code:
          type: string
          nullable: true
        status_url:
          type: string
    VisibilityEngine:
      type: string
      enum: [chatgpt, perplexity, gemini, google_ai_overviews]
    VisibilityResult:
      type: object
      required: [id, run_id, prompt_id, prompt_text, prompt_position, engine, collector, fetched_at, outcome, raw_answer, sources, error_code, appearances]
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        prompt_id:
          type: string
          format: uuid
          description: Historical identifier; the live tracking prompt may have been deleted
        prompt_text:
          type: string
        prompt_position:
          type: integer
          minimum: 0
        engine:
          $ref: "#/components/schemas/VisibilityEngine"
        collector:
          type: string
          enum: [stub, cloro]
          description: stub is sample data; cloro identifies live collection
        fetched_at:
          type: string
          format: date-time
          nullable: true
        outcome:
          type: string
          enum: [cited, mentioned, miss, error]
          nullable: true
        raw_answer:
          type: string
        sources:
          type: array
          items:
            type: string
            format: uri
        error_code:
          type: string
          nullable: true
        appearances:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorAppearance"
    AppearanceEvidence:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [mention, citation, entity, link]
        value:
          type: string
    CompetitorAppearance:
      type: object
      required: [competitor_id, name, confirmed, evidence]
      properties:
        competitor_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        confirmed:
          type: boolean
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AppearanceEvidence"
    VisibilityRunPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VisibilityRunStatus"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    VisibilityResultPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VisibilityResult"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    TrackingStatus:
      type: object
      required: [prompts_reviewed, competitors_reviewed, started_at, next_run_at, blocked_reason]
      properties:
        prompts_reviewed:
          type: boolean
        competitors_reviewed:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
          nullable: true
        blocked_reason:
          type: string
