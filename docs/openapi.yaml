openapi: 3.0.3
info:
  title: Koi API
  version: 0.0.0
servers:
  - url: /
tags:
  - name: auth
  - name: health
paths:
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsReq"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRes"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsReq"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204":
          description: No Content
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: me
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRes"
        "401":
          $ref: "#/components/responses/Error"
  /health:
    get:
      tags: [health]
      operationId: get
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: koi_session
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
  schemas:
    CredentialsReq:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    MeRes:
      type: object
      required: [id, email, organization]
      properties:
        id:
          type: string
        email:
          type: string
        organization:
          $ref: "#/components/schemas/OrgRes"
    OrgRes:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
    HealthResponse:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
        db:
          type: string
    Envelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
