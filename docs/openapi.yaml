openapi: 3.0.3
info:
  title: Koi API
  version: 0.0.0
servers:
  - url: /
tags:
  - name: auth
  - name: brands
  - name: prompts
  - name: competitors
  - name: health
paths:
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsReq"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRes"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsReq"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204":
          description: No Content
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: me
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRes"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/brands:
    get:
      tags: [brands]
      operationId: listBrands
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Page of brands owned by the session user, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [brands]
      operationId: createBrand
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/brands/countries:
    get:
      tags: [brands]
      operationId: listBrandCountries
      description: Returns all supported countries when q is omitted or blank; otherwise filters the committed Cloro country snapshot by a case-insensitive code or English-name prefix.
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Supported countries ordered by English name, or up to 20 prefix matches ordered by match quality
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryOption"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [brands]
      operationId: getBrand
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Brand owned by the session user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRes"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [brands]
      operationId: updateBrand
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandPatchRequest"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompts:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    get:
      tags: [prompts]
      operationId: listPrompts
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Prompts for the owned brand in creation order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptRes"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [prompts]
      operationId: createPrompt
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptRequest"
      responses:
        "201":
          description: Manually created and confirmed prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompts/{promptID}:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/PromptID"
    patch:
      tags: [prompts]
      operationId: updatePrompt
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPatchRequest"
      responses:
        "200":
          description: Updated prompt with confirmation and source preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [prompts]
      operationId: deletePrompt
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompts/{promptID}/confirm:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/PromptID"
    post:
      tags: [prompts]
      operationId: confirmPrompt
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Confirmed prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRes"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/prompts/confirm:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    post:
      tags: [prompts]
      operationId: confirmAllPrompts
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All prompts confirmed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptRes"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/competitors:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    get:
      tags: [competitors]
      operationId: listCompetitors
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Tracked competitors for the owned brand in creation order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitorRes"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [competitors]
      operationId: createCompetitor
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorRequest"
      responses:
        "201":
          description: Manually created and confirmed competitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/competitors/{competitorID}:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/CompetitorID"
    patch:
      tags: [competitors]
      operationId: updateCompetitor
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorPatchRequest"
      responses:
        "200":
          description: Updated competitor with confirmation and source preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorRes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [competitors]
      operationId: deleteCompetitor
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/competitors/{competitorID}/confirm:
    parameters:
      - $ref: "#/components/parameters/BrandID"
      - $ref: "#/components/parameters/CompetitorID"
    post:
      tags: [competitors]
      operationId: confirmCompetitor
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Confirmed competitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorRes"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/brands/{brandID}/competitors/confirm:
    parameters:
      - $ref: "#/components/parameters/BrandID"
    post:
      tags: [competitors]
      operationId: confirmAllCompetitors
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All competitors confirmed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitorRes"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /health:
    get:
      tags: [health]
      operationId: get
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  parameters:
    BrandID:
      name: brandID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PromptID:
      name: promptID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompetitorID:
      name: competitorID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: koi_session
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
  schemas:
    BrandRequest:
      type: object
      description: At least one of domain or github_repo is required.
      required: [name, country]
      properties:
        name:
          type: string
        domain:
          type: string
        github_repo:
          type: string
          format: uri
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        description:
          type: string
          description: Briefly describe what this brand offers.
    BrandPatchRequest:
      type: object
      description: Editable brand fields. At least one of domain or github_repo must remain after the update.
      properties:
        name:
          type: string
        domain:
          type: string
        github_repo:
          type: string
          format: uri
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        description:
          type: string
          description: Briefly describe what this brand offers.
    BrandRes:
      type: object
      required: [id, user_id, name, domain, github_repo, country, description]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        github_repo:
          type: string
        country:
          type: string
        description:
          type: string
    BrandPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BrandRes"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    CountryOption:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[A-Z]{2}$"
        name:
          type: string
    PromptRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
    PromptPatchRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
    PromptRes:
      type: object
      required: [id, brand_id, text, source, confirmed]
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        text:
          type: string
        source:
          type: string
          enum: [manual, drafted]
        confirmed:
          type: boolean
    CompetitorRequest:
      type: object
      additionalProperties: false
      required: [name, domain, aliases]
      properties:
        name:
          type: string
        domain:
          type: string
        aliases:
          type: array
          items:
            type: string
    CompetitorPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        domain:
          type: string
        aliases:
          type: array
          items:
            type: string
    CompetitorRes:
      type: object
      required: [id, brand_id, name, domain, aliases, source, confirmed]
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        aliases:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [manual, drafted, observed]
        confirmed:
          type: boolean
    CredentialsReq:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    MeRes:
      type: object
      required: [id, email, organization]
      properties:
        id:
          type: string
        email:
          type: string
        organization:
          $ref: "#/components/schemas/OrgRes"
    OrgRes:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
    HealthResponse:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
        db:
          type: string
    Envelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          $ref: "#/components/schemas/FieldCode"
    ErrorCode:
      type: string
      enum:
        - validation
        - email_taken
        - brand_limit_reached
        - invalid_credentials
        - not_found
        - unauthorized
        - invalid_json
        - internal
    FieldCode:
      type: string
      enum:
        - invalid
        - min_length
        - taken
