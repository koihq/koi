          type: string
        password:
          type: string
    AuthRes:
      type: object
      required: [id, email, organization]
      properties:
        id:
          type: string
        email:
          type: string
        organization:
          $ref: "#/components/schemas/OrgRes"
    MeRes:
      allOf:
        - $ref: "#/components/schemas/AuthRes"
        - type: object
          required: [activeBrand]
          properties:
            activeBrand:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/BrandRes"
    OrgRes:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
    HealthResponse:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
        db:
          type: string
    CapabilitiesResponse:
      type: object
      required: [competitorSearch, aiDrafting, liveCollection, cloudBilling]
      properties:
        cloudBilling:
          type: boolean
        liveCollection:
          type: boolean
        competitorSearch:
          type: boolean
        aiDrafting:
          type: boolean
    BillingAllowanceRequest:
      type: object
      required: [prompts]
      properties:
        prompts:
          type: integer
          minimum: 5
          maximum: 500
          description: "Selectable allowances: 5, 10, 15, 25, 50, 75, 100, 150, 200, 250, 350, 500."
    BillingQuote:
      type: object
      required: [prompts, amountCents, currency, interval]
      properties:
        prompts:
          type: integer
        amountCents:
          type: integer
          format: int64
        currency:
          type: string
        interval:
          type: string
    BillingCatalog:
      type: object
      required: [currency, interval, options]
      properties:
        currency:
          type: string
        interval:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/BillingQuote"
    BillingSubscription:
      type: object
      required: [organizationId, quantity, status, cancelAtPeriodEnd]
      properties:
        organizationId:
          type: string
          format: uuid
        quantity:
          type: integer
        status:
          type: string
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        trialEnd:
          type: string
          format: date-time
          nullable: true
        pendingQuantity:
          type: integer
          nullable: true
        pendingUpgradeQuantity:
          type: integer
          nullable: true
        pendingUpgradeExpiresAt:
          type: string
          format: date-time
          nullable: true
        paymentUrl:
          type: string
        cancelAtPeriodEnd:
          type: boolean
    BillingStatus:
      type: object
      required: [subscription, promptLimit, trialAvailable]
      properties:
        subscription:
          allOf:
            - $ref: "#/components/schemas/BillingSubscription"
          nullable: true
        promptLimit:
          type: integer
        trialAvailable:
          type: boolean
    BillingConfirmCheckoutRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
    BillingRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    BillingChange:
      type: object
      required: [quantity, effective]
      properties:
        quantity:
          type: integer
        effective:
          type: string
          enum: [current, trial_end, next_cycle, after_payment]
        paymentUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    GenerationRequest:
      type: object
      required: [brandId, mode]
      properties:
        brandId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [initial, prompts, competitors]
    GenerationAccepted:
      type: object
      required: [id, mode, state, statusUrl]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [initial, prompts, competitors]
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        statusUrl:
          type: string
    GenerationStatus:
      type: object
      required: [id, mode, state, attempt, promptCount, competitorCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [initial, prompts, competitors]
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        attempt:
          type: integer
          minimum: 0
        promptCount:
          type: integer
          minimum: 0
        competitorCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        nextRetryAt:
          type: string
          format: date-time
        errorCode:
          type: string
    GenerationPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GenerationStatus"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    Envelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        requestId:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        statusUrl:
          type: string
          description: Present for generation_conflict to locate the active run.
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          $ref: "#/components/schemas/FieldCode"
    ErrorCode:
      type: string
      enum:
        - resource_conflict
        - validation
        - email_taken
        - brand_limit_reached
        - invalid_credentials
        - not_found
        - unauthorized
        - invalid_json
        - internal
        - feature_unavailable
        - generation_conflict
        - idempotency_conflict
        - initial_already_completed
        - billing_required
        - prompt_limit_reached
    FieldCode:
      type: string
      enum:
        - invalid
        - min_length
        - taken
