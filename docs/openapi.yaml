      properties:
        name:
          type: string
        domain:
          type: string
        github_repo:
          type: string
          format: uri
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        description:
          type: string
          description: Briefly describe what this brand offers.
    BrandRes:
      type: object
      required: [id, organization_id, name, domain, github_repo, country, description]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        github_repo:
          type: string
        country:
          type: string
        description:
          type: string
    BrandPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BrandRes"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    PromptPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PromptRes"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    CompetitorPage:
      type: object
      required: [items, totalItems, totalPages, currentPage, hasNext, hasPrev]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorRes"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        currentPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    CountryOption:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[A-Z]{2}$"
        name:
          type: string
    PromptRequest:
      type: object
