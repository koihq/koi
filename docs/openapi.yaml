          enum: [collection_unavailable, reviews_required, prompts_required, generation_active]
    BrandRequest:
      type: object
      description: At least one of domain or github_repo is required.
      required: [name, country]
      properties:
        name:
          type: string
        domain:
          type: string
        github_repo:
          type: string
          format: uri
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        description:
          type: string
