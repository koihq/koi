name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, production]
      image_tag:
        description: Existing sha-<commit> or vX.Y.Z image tag
        required: true
        type: string

concurrency:
  group: koi-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  dev:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: dev
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Check main is current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$main_sha" = "$TESTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; its CI run will deploy it.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.current.outputs.current == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.current.outputs.current == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.current.outputs.current == 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.current.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested commit
        if: steps.current.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          build-args: |
            VERSION=sha-${{ github.event.workflow_run.head_sha }}
            REVISION=${{ github.event.workflow_run.head_sha }}

      - name: Deploy dev
        if: steps.current.outputs.current == 'true'
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          KOI_SMOKE_URL: ${{ vars.KOI_SMOKE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KOI_IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: bash scripts/deploy-coolify.sh

      - name: Publish landing
        if: steps.current.outputs.current == 'true' && vars.COOLIFY_SITE_APP_UUID != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.site
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-site:sha-${{ github.event.workflow_run.head_sha }}
          build-args: |
            APP_URL=${{ vars.KOI_SMOKE_URL }}

      - name: Deploy dev landing
        if: steps.current.outputs.current == 'true' && vars.COOLIFY_SITE_APP_UUID != ''
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_SITE_APP_UUID }}
          KOI_SMOKE_URL: ${{ vars.KOI_SITE_URL }}
          KOI_SMOKE_KIND: site
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KOI_IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: bash scripts/deploy-coolify.sh

  release:
    needs: dev
    if: needs.dev.outputs.current == 'true' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main

  production:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      packages: write
    env:
      HUSKY: 0
    steps:
      # GoReleaser reads the version from the release tag, so it needs the tags in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Binaries and checksums go to the Release Please release; the image goes to GHCR.
      - name: Publish release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy production
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          KOI_SMOKE_URL: ${{ vars.KOI_SMOKE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KOI_IMAGE_TAG: ${{ needs.release.outputs.tag }}
        run: bash scripts/deploy-coolify.sh

      # The landing reads prices from the catalog, so it goes live with the release that bills them.
      - name: Publish landing
        if: vars.COOLIFY_SITE_APP_UUID != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.site
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-site:${{ needs.release.outputs.tag }}
          # Only the production landing carries the public PostHog project key.
          build-args: |
            APP_URL=${{ vars.KOI_SMOKE_URL }}
            POSTHOG_KEY=${{ vars.POSTHOG_KEY }}

      - name: Deploy production landing
        if: vars.COOLIFY_SITE_APP_UUID != ''
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_SITE_APP_UUID }}
          KOI_SMOKE_URL: ${{ vars.KOI_SITE_URL }}
          KOI_SMOKE_KIND: site
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KOI_IMAGE_TAG: ${{ needs.release.outputs.tag }}
        run: bash scripts/deploy-coolify.sh

  retry:
    if: github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published image
        env:
          GH_TOKEN: ${{ github.token }}
          KOI_IMAGE_TAG: ${{ inputs.image_tag }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$KOI_IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh release view "$KOI_IMAGE_TAG" --json tagName --jq .tagName >/dev/null
          elif [[ "$TARGET" == dev && "$KOI_IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/${KOI_IMAGE_TAG#sha-}" --jq .sha >/dev/null
          else
            echo 'Invalid image tag for target environment' >&2
            exit 1
          fi
          docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY:$KOI_IMAGE_TAG" >/dev/null

      - name: Deploy existing image
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          KOI_SMOKE_URL: ${{ vars.KOI_SMOKE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KOI_IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash scripts/deploy-coolify.sh
