name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, production]
      image_tag:
        description: Existing sha-<commit> or vX.Y.Z image tag
        required: true
        type: string

concurrency:
  group: koi-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  dev:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: dev
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Check main is current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$main_sha" = "$TESTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; its CI run will deploy it.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.current.outputs.current == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v4.1.0
        if: steps.current.outputs.current == 'true'

      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.current.outputs.current == 'true'

      - uses: docker/login-action@v4.7.0
        if: steps.current.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested commit
        if: steps.current.outputs.current == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          build-args: |
            VERSION=sha-${{ github.event.workflow_run.head_sha }}
            REVISION=${{ github.event.workflow_run.head_sha }}

      - name: Deploy dev
        if: steps.current.outputs.current == 'true'
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          KOI_SMOKE_URL: ${{ vars.KOI_SMOKE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KOI_IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: bash scripts/deploy-coolify.sh

  release:
    needs: dev
    if: needs.dev.outputs.current == 'true'
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main

  production:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: docker/setup-qemu-action@v4.1.0

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag }}
          build-args: |
            VERSION=${{ needs.release.outputs.tag }}
            REVISION=${{ needs.release.outputs.sha }}

      - name: Deploy production
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          KOI_SMOKE_URL: ${{ vars.KOI_SMOKE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KOI_IMAGE_TAG: ${{ needs.release.outputs.tag }}
        run: bash scripts/deploy-coolify.sh

  retry:
    if: github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published image
        env:
          GH_TOKEN: ${{ github.token }}
          KOI_IMAGE_TAG: ${{ inputs.image_tag }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$KOI_IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh release view "$KOI_IMAGE_TAG" --json tagName --jq .tagName >/dev/null
          elif [[ "$TARGET" == dev && "$KOI_IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/${KOI_IMAGE_TAG#sha-}" --jq .sha >/dev/null
          else
            echo 'Invalid image tag for target environment' >&2
            exit 1
          fi
          docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY:$KOI_IMAGE_TAG" >/dev/null

      - name: Deploy existing image
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          KOI_SMOKE_URL: ${{ vars.KOI_SMOKE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KOI_IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash scripts/deploy-coolify.sh
