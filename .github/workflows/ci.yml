name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koi
          POSTGRES_PASSWORD: koi
          POSTGRES_DB: koi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koi -d koi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Stub embedded UI
        run: |
          mkdir -p pkg/web/dist
          echo '<!doctype html><html><head><title>Koi</title></head><body></body></html>' > pkg/web/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Go formatting
        run: make go-format-check

      - name: Test
        env:
          KOI_DATABASE_URL: postgres://koi:koi@localhost:5432/koi?sslmode=disable
        run: go test ./...

  frontend:
    runs-on: ubuntu-24.04
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir ui install --frozen-lockfile

      - name: Formatting, lint, and imports
        run: pnpm --dir ui check

      - name: Typecheck
        run: pnpm --dir ui check-types

      - name: Test
        run: pnpm --dir ui test
