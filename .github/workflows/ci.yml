name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: koi
          POSTGRES_PASSWORD: koi
          POSTGRES_DB: koi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koi -d koi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Stub embedded UI
        run: |
          mkdir -p pkg/web/dist
          echo '<!doctype html><html><head><title>Koi</title></head><body></body></html>' > pkg/web/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Go formatting
        run: make go-format-check

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Test
        env:
          KOI_DATABASE_URL: postgres://koi:koi@localhost:5432/koi?sslmode=disable
        run: go test ./...

  frontend:
    runs-on: ubuntu-24.04
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir ui install --frozen-lockfile

      - name: Formatting, lint, and imports
        run: pnpm --dir ui check

      - name: Typecheck
        run: pnpm --dir ui check-types

      - name: Install Chromium for browser tests
        run: pnpm --dir ui exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --dir ui test

  e2e:
    runs-on: ubuntu-24.04
    env:
      HUSKY: 0
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: koi
          POSTGRES_PASSWORD: koi
          POSTGRES_DB: koi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koi -d koi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir ui exec playwright install --with-deps chromium

      - name: Full-stack journeys
        env:
          KOI_DATABASE_URL: postgres://koi:koi@localhost:5432/koi?sslmode=disable
        run: pnpm --dir ui test:e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: koi:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

      - name: Check image version
        run: |
          docker run --rm koi:ci --version
          test "$(docker image inspect koi:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"

  # Catches a broken release config on the PR instead of on the release commit.
  release-config:
    runs-on: ubuntu-24.04
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Check and build one target
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: build --snapshot --clean --single-target
