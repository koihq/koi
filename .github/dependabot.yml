version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    versioning-strategy: increase
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Node majors alternate between Current and LTS; move to a new LTS line by hand.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
