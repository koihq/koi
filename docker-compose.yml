services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: koi
      POSTGRES_PASSWORD: koi
      POSTGRES_DB: koi
    ports:
      - "5432:5432"
    volumes:
      - koi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koi -d koi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  koi_pg:
