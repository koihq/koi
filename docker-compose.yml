services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: koi
      POSTGRES_PASSWORD: koi
      POSTGRES_DB: koi
    ports:
      - "5432:5432"
    volumes:
      - koi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koi -d koi"]
      interval: 5s
      timeout: 3s
      retries: 10

  koi:
    profiles: [image]
    image: koi:local
    build:
      context: .
      args:
        VERSION: local
        REVISION: local
    environment:
      KOI_PORT: :8080
      KOI_DEPLOYMENT_MODE: selfhosted
      KOI_DATABASE_URL: postgres://koi:koi@postgres:5432/koi?sslmode=disable
      KOI_SESSION_SECRET: ${KOI_SESSION_SECRET:-}
      KOI_CLORO_API_KEY: ${KOI_CLORO_API_KEY:-}
      KOI_OPENROUTER_API_KEY: ${KOI_OPENROUTER_API_KEY:-}
      LOGODEV_SECRET_KEY: ${LOGODEV_SECRET_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 90s

volumes:
  koi_pg:
